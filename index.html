<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Residential Nav-Link</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #panorama {
            width: 100%;
            height: 100vh;
        }

        /* --- SIMPLE UI OVERLAY --- */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .header {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00f2ff;
            padding: 10px 20px;
            border-radius: 5px;
            pointer-events: auto;
        }

        .sector-title {
            font-size: 0.8rem;
            color: #00f2ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .room-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* --- SIDEBAR NAVIGATION --- */
        .menu-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00f2ff;
            color: #00f2ff;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: auto;
            text-transform: uppercase;
        }

        #sidebar {
            position: absolute;
            top: 70px; right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 242, 255, 0.5);
            border-radius: 5px;
            padding: 15px;
            width: 200px;
            display: none;
            pointer-events: auto;
        }

        .nav-category {
            font-size: 0.7rem;
            color: #888;
            margin: 15px 0 5px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .nav-link {
            display: block;
            width: 100%;
            background: none;
            border: none;
            color: #fff;
            text-align: left;
            padding: 8px 5px;
            cursor: pointer;
            border-radius: 3px;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(0, 242, 255, 0.2);
            color: #00f2ff;
        }

        /* --- CUSTOM HOTSPOTS --- */
        .custom-hotspot {
            width: 24px; height: 24px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00f2ff;
            border-radius: 50%;
            cursor: pointer;
        }

        .custom-tooltip {
            visibility: hidden;
            position: absolute;
            bottom: 30px; left: -30px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00f2ff;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            white-space: nowrap;
            font-size: 12px;
        }

        .custom-hotspot:hover .custom-tooltip {
            visibility: visible;
        }
    </style>
</head>
<body>

    <div id="panorama"></div>

    <div id="ui-layer">
        <div class="header">
            <div class="sector-title">Current Sector</div>
            <div class="room-name" id="display-name">BACKYARD: GRASS AREA</div>
        </div>

        <button class="menu-btn" onclick="toggleMenu()">Menu ☰</button>

        <div id="sidebar">
            <div class="nav-category">BACKYARD</div>
            <button class="nav-link active" onclick="loadRoom('grass_area')">Grass Area</button>
            <button class="nav-link" onclick="loadRoom('brick_area')">Brick Area</button>
            <button class="nav-link" onclick="loadRoom('garage')">Garage</button>

            <div class="nav-category">FIRST FLOOR</div>
            <button class="nav-link" onclick="loadRoom('living_room')">Living Room</button>
            <button class="nav-link" onclick="loadRoom('dining_room')">Dining Room</button>
            <button class="nav-link" onclick="loadRoom('kitchen')">Kitchen</button>
            <button class="nav-link" onclick="loadRoom('laundry_room')">Laundry Room</button>
            <button class="nav-link" onclick="loadRoom('red_bench')">Red Bench</button>
        </div>
    </div>

<script>
    // --- HOTSPOT CREATOR ---
    function makeIcon(hotSpotDiv, args) {
        hotSpotDiv.classList.add('custom-hotspot');
        let tooltip = document.createElement('div');
        tooltip.classList.add('custom-tooltip');
        tooltip.innerHTML = args.text;
        hotSpotDiv.appendChild(tooltip);
    }

    // --- PANNELLUM VIEWER ---
    const viewer = pannellum.viewer('panorama', {
        "default": {
            "firstScene": "grass_area", // Defaults to backyard grass
            "sceneFadeDuration": 1000,
            "autoLoad": true,
            "showControls": true
        },
        "scenes": {
            // --- BACKYARD ---
            "grass_area": {
                "title": "Backyard: Grass Area",
                "type": "equirectangular",
                "panorama": "grass.jpg",
                "hotSpots": [
                    { "pitch": 0, "yaw": 90, "type": "scene", "sceneId": "garage", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Go to Garage"} },
                    { "pitch": -45, "yaw": 0, "type": "scene", "sceneId": "brick_area", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Go to brick area"} },
                    { "pitch": 0, "yaw": 0, "type": "scene", "sceneId": "kitchen", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Enter Kitchen"} }
                ]
            },
            "brick_area": {
                "title": "Backyard: Brick Area",
                "type": "equirectangular",
                "panorama": "placeholders/brick_area.jpg",
                "hotSpots": [
                    { "pitch": 0, "yaw": -90, "type": "scene", "sceneId": "grass_area", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Go to Grass Area"} }
                ]
            },
            "garage": {
                "title": "Garage",
                "type": "equirectangular",
                "panorama": "placeholders/garage.jpg",
                "hotSpots": [
                    { "pitch": 0, "yaw": 0, "type": "scene", "sceneId": "grass_area", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Exit to Backyard"} },
                    { "pitch": 0, "yaw": -90, "type": "scene", "sceneId": "laundry_room", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Enter Laundry Room"} }
                ]
            },

            // --- FIRST FLOOR ---
            "living_room": {
                "title": "Living Room",
                "type": "equirectangular",
                "panorama": "placeholders/living_room.jpg",
                "hotSpots": [
                    { "pitch": 0, "yaw": 90, "type": "scene", "sceneId": "dining_room", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Go to Dining Room"} },
                    { "pitch": 0, "yaw": 180, "type": "scene", "sceneId": "red_bench", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Go to Red Bench"} }
                ]
            },
            "dining_room": {
                "title": "Dining Room",
                "type": "equirectangular",
                "panorama": "placeholders/dining_room.jpg",
                "hotSpots": [
                    { "pitch": 0, "yaw": -90, "type": "scene", "sceneId": "living_room", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Go to Living Room"} },
                    { "pitch": 0, "yaw": 90, "type": "scene", "sceneId": "kitchen", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Go to Kitchen"} }
                ]
            },
            "kitchen": {
                "title": "Kitchen",
                "type": "equirectangular",
                "panorama": "placeholders/kitchen.jpg",
                "hotSpots": [
                    { "pitch": 0, "yaw": -90, "type": "scene", "sceneId": "dining_room", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Go to Dining Room"} },
                    { "pitch": 0, "yaw": 90, "type": "scene", "sceneId": "laundry_room", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Go to Laundry Room"} },
                    { "pitch": 0, "yaw": 180, "type": "scene", "sceneId": "grass_area", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Exit to Backyard"} }
                ]
            },
            "laundry_room": {
                "title": "Laundry Room",
                "type": "equirectangular",
                "panorama": "placeholders/laundry_room.jpg",
                "hotSpots": [
                    { "pitch": 0, "yaw": -90, "type": "scene", "sceneId": "kitchen", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Go to Kitchen"} },
                    { "pitch": 0, "yaw": 90, "type": "scene", "sceneId": "garage", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Enter Garage"} }
                ]
            },
            "red_bench": {
                "title": "Red Bench",
                "type": "equirectangular",
                "panorama": "placeholders/red_bench.jpg",
                "hotSpots": [
                    { "pitch": 0, "yaw": 0, "type": "scene", "sceneId": "living_room", "createTooltipFunc": makeIcon, "createTooltipArgs": {"text": "Go to Living Room"} }
                ]
            }
        }
    });

    // --- UI LOGIC ---
    function toggleMenu() {
        const sidebar = document.getElementById('sidebar');
        sidebar.style.display = sidebar.style.display === 'block' ? 'none' : 'block';
    }

    function loadRoom(sceneId) {
        viewer.loadScene(sceneId);
        toggleMenu(); // Close menu after selection
    }

    viewer.on('scenechange', function() {
        // Update Title
        const currentConfig = viewer.getConfig();
        document.getElementById('display-name').innerText = currentConfig.title.toUpperCase();

        // Update active class in menu
        const currentScene = viewer.getScene();
        document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.querySelector(`.nav-link[onclick="loadRoom('${currentScene}')"]`);
        if (activeBtn) activeBtn.classList.add('active');
    });
</script>
</body>
</html>
